<!DOCTYPE html>

  <link rel="icon" href="logo.png">
  <style>
    :root {
      --bg: #000;
      --paper: #ececec;
      --ink: #111;
      --muted: #6a6a6a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg);

    .frame {

      display: block;
      margin: 0 auto 1.5rem;
    }
    h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    .lede {
      color: #cfcfcf;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    nav.archive-nav {
      margin-top: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 1.25rem;
    }
    nav.archive-nav a {
      color: #cfcfcf;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    nav.archive-nav a:hover,
    nav.archive-nav a[aria-current="page"] {
      color: #fff;
    }
    main {
      width: min(720px, 100%);
      min-height: 40vh;
      margin-top: 3rem;
    }
  </style>
</head>
